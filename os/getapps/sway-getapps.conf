# OrionOS Get apps and Share files (os/getapps -> /etc/sway/config.d/61-orion-getapps.conf, read by the session's
# "include /etc/sway/config.d/*"). Both float in the middle like Settings. Their app ids avoid the word "orion",
# which the main config sends to the HUD's workspace full screen.
for_window [app_id="^local\.GetApps$"] floating enable, resize set 1120 760, move position center
for_window [app_id="^local\.ShareFiles$"] floating enable, resize set 760 540, move position center
