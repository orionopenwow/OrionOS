# OrionOS (os/safety, apps/daemon/self_updates.py): unattended-upgrades only installs by itself when Orion's
# permission level for security updates allows it (and Orion isn't frozen); afterwards Orion checks its health
# again and writes the change in its history. The snapshot before comes from the apt hook (80orion-snapshot).
[Service]
ExecCondition=/usr/local/bin/orion-self-gate security_update
ExecStartPost=-/usr/local/bin/orion-selftest after-update security_update
