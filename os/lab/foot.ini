# OrionOS terminal: "Event Horizon" (Art Update §7). Martian Mono on Void, Starlight text, a Photon block cursor.
font=Martian Mono:size=10.5, monospace:size=11, Noto Color Emoji:size=10
pad=14x12
dpi-aware=no

[cursor]
style=block
color=05070E 00E5FF
blink=no

[colors]
alpha=0.92
background=05070E
foreground=D8DEFF
#           normal / bright pairs, exactly as in the plan's table
# black
regular0=0B0F1E
bright0=262D50
# red (rose)
regular1=FF5C8A
bright1=FF8AAD
# green (aurora mint)
regular2=5CFFB0
bright2=9BFFD0
# yellow (ember)
regular3=FFC66B
bright3=FFDCA0
# blue
regular4=6E8BFF
bright4=9DB0FF
# magenta (violet)
regular5=9D85FF
bright5=C2B3FF
# cyan
regular6=00E5FF
bright6=7FF2FF
# white
regular7=D8DEFF
bright7=FFFFFF
selection-foreground=FFFFFF
selection-background=3B2F80
urls=00E5FF
scrollback-indicator=05070E 7C5CFF
# Settings > Accessibility: bigger text and high contrast (written by orion-access; must be the last line)
include=~/.config/foot/orion-access.ini
