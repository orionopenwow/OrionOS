# OrionOS: the optional Hyprland session (after-1.0 plan §3, Phase 4). The default OrionOS session stays Sway/SwayFX;
# this one is only used when you pick it (orion-gravity session hyprland, or Settings > Keyboard & windows) and
# Hyprland is installed (ORION_WITH_HYPRLAND=1 at provisioning: os/image/os-hyprland.sh).
# Installed as /etc/orion/hypr/hyprland.conf; started by orion-session with `Hyprland -c` on this file.
# Your own additions go in ~/.config/orion/hypr.d/user.conf (sourced last, never overwritten).
#
# Same Orion look as the Sway session: deep-space colours, frosted glass windows with 16 px corners and a violet
# edge on the window in focus, soft deep shadows, dimmer windows behind. Same shortcuts.

monitor = , preferred, auto, auto

$mod = SUPER
$term = foot
$menu = wofi --show drun

# ---- what orion-session prepared for this login: keyboard layout and Gravity mode (screen shader on/off)
source = ~/.config/orion/hypr.d/keyboard.conf
source = ~/.config/orion/hypr.d/gravity.conf

# ---- session: the same supervised Orion services as under Sway (os/lab/systemd), then the Gravity watcher
exec-once = orion-session-start
exec-once = orion-gravity watch
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Orion
exec-once = gsettings set org.gnome.desktop.interface font-name 'Figtree 10'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Orion-Glass
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Orion
exec-once = sh -c 'command -v swaybg >/dev/null && exec swaybg -m fill -i "$HOME/.config/sway/wallpaper.png"'
env = XCURSOR_THEME,Orion
env = XDG_CURRENT_DESKTOP,Hyprland

# ---- the look (Art Update window style)
general {
    gaps_in = 5
    gaps_out = 6
    border_size = 2
    # focused: Accretion violet into Photon cyan; others: Edge
    col.active_border = rgba(7c5cffee) rgba(00e5ffcc) 45deg
    col.inactive_border = rgba(262d50aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.12
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.2
    }
    # Gravity mode's screen shader is set from ~/.config/orion/hypr.d/gravity.conf (off by default)
    # orion:shadow-block (Hyprland 0.45+; os-hyprland.sh swaps in drop_shadow lines for older versions)
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(05070ecc)
    }
    # orion:shadow-block-end
}

animations {
    enabled = true
    bezier = orion, 0.22, 1, 0.36, 1
    # new windows grow out of the centre, minimised ones spiral away (Art Update §4), calm durations
    animation = windows, 1, 5, orion, popin 80%
    animation = windowsOut, 1, 4, orion, popin 60%
    animation = fade, 1, 4, orion
    animation = workspaces, 1, 5, orion, slidefade 12%
    animation = border, 1, 8, orion
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(05070e)
    force_default_wallpaper = 0
    focus_on_activate = true
}

input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ---- Orion's own windows (same rules as the Sway session)
windowrulev2 = workspace 1, class:^(?i)(.*orion.*)$
windowrulev2 = fullscreen, class:^(?i)(ai\.orion\.hud|orion)$
windowrulev2 = float, class:^(ai\.orion\.Settings)$
windowrulev2 = size 1040 700, class:^(ai\.orion\.Settings)$
windowrulev2 = center, class:^(ai\.orion\.Settings)$
windowrulev2 = workspace 2, class:^(ai\.orion\.Settings)$
windowrulev2 = float, class:^(ai\.orion\.Rescue)$
windowrulev2 = pin, class:^(ai\.orion\.Rescue)$
windowrulev2 = center, class:^(ai\.orion\.Rescue)$
windowrulev2 = float, class:^(pavucontrol|wdisplays|swappy)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1|lxpolkit)$
windowrulev2 = float, title:^(orion-tool)$
windowrulev2 = float, class:^(keys-overlay)$
windowrulev2 = pin, class:^(keys-overlay)$
layerrule = blur, notifications
layerrule = blur, orion-shortcuts

# ---- shortcuts (the same as the Sway session; Super+/ lists them)
bind = CTRL ALT, Delete, exec, orion-rescue
bind = $mod, Escape, exec, orion-rescue
bind = $mod, O, workspace, 1
bind = CTRL ALT, O, workspace, 1
bind = $mod, Return, exec, $term
bind = CTRL ALT, T, exec, $term
bind = $mod, D, exec, $menu
bind = CTRL ALT, Space, exec, $menu
bind = $mod, E, exec, orion-files
bind = CTRL ALT, E, exec, orion-files
bind = $mod, comma, exec, orion-settings
bind = CTRL ALT, S, exec, orion-settings
bind = $mod, L, exec, orion-lock
bind = CTRL ALT, L, exec, orion-lock
bind = $mod SHIFT, Q, killactive,
bind = ALT, F4, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exec, orion-ctl logout || hyprctl dispatch exit
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = ALT, Tab, exec, orion-windows switch
bind = $mod, W, exec, orion-windows menu
bind = $mod, H, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, H, togglespecialworkspace, minimized
bind = $mod, slash, exec, orion-shortcuts toggle
bind = CTRL ALT, slash, exec, orion-shortcuts toggle
bind = $mod, G, exec, orion-gravity toggle
bind = , Print, exec, orion-screenshot full
bind = SHIFT, Print, exec, orion-screenshot area
bind = CTRL, Print, exec, orion-screenshot markup
bind = $mod, V, exec, orion-clipboard pick
bind = CTRL ALT, V, exec, orion-clipboard pick
bind = $mod, N, exec, orion-nightlight toggle
bind = CTRL ALT, M, exec, orion-ctl mic toggle | xargs -0 notify-send Orion
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, orion-ctl mic toggle | xargs -0 notify-send Orion
bindl = , switch:on:Lid Switch, exec, orion-displays lid close
bindl = , switch:off:Lid Switch, exec, orion-displays lid open
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

source = ~/.config/orion/hypr.d/user.conf
