# OrionOS — SwayFX glass (Art Update §4 "Window style"). Installed as /etc/sway/orion-fx.conf.
# Only SwayFX reads this: orion-session links it into $XDG_RUNTIME_DIR/orion-sway-fx/ when it starts SwayFX, and
# the main config includes that folder. Plain Sway (the fallback) never sees these commands.

# Frosted glass: the black hole and the stars glow through. Window see-through itself comes from the
# "Orion Glass" GTK theme (34% see-through backgrounds) and the opacity rules below.
blur enable
blur_xray disable
blur_passes 3
blur_radius 6
blur_noise 0.02
blur_brightness 0.9
blur_contrast 0.95
blur_saturation 1.15

# 16 px rounded corners, a soft deep shadow, a thin light edge (the 2 px border from the main config).
corner_radius 16
smart_corner_radius enable
shadows enable
shadows_on_csd enable
shadow_blur_radius 40
shadow_offset 0 12
shadow_color #02030AB3
shadow_inactive_color #02030A80
titlebar_separator disable

# Windows behind the focused one are slightly dimmer (the focused one keeps its violet edge, see client.focused).
default_dim_inactive 0.12
dim_inactive_colors.unfocused #05070EFF
dim_inactive_colors.urgent #FF5C8A33

# Apps that can't make their own background see-through (Electron, XWayland) get Sway's opacity instead.
for_window [app_id="^(code|code-oss|codium|VSCodium|code-url-handler)$"] opacity 0.90
for_window [class="^(Code|VSCodium)$"] opacity 0.90
for_window [app_id="^(pavucontrol|wdisplays|org.pulseaudio.pavucontrol)$"] opacity 0.92

# Orion's own HUD draws its glass itself and runs full screen (SwayFX doesn't round or shadow full-screen
# windows); it is never dimmed. (corner_radius is global-only in SwayFX 0.5: never put it in a for_window rule.)
for_window [app_id="(?i)orion"] dim_inactive 0
for_window [title="(?i)^orion$"] dim_inactive 0
for_window [title="^orion-tool$"] dim_inactive 0

# Launcher and notifications float on blurred glass too (their own colours stay as they are).
layer_effects "wofi" blur enable; shadows enable
layer_effects "notifications" blur enable; shadows enable
# Orion's tray (orion-tray, waybar with only its tray) and the shortcut panel are glass too.
layer_effects "waybar" blur enable; shadows enable; corner_radius 14
layer_effects "orion-shortcuts" blur enable; shadows enable
