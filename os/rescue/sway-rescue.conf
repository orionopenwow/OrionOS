# OrionOS Rescue desktop (os/rescue/orion-rescue-session). Plain Sway: windows with title bars, a visible bar with
# the keys, a terminal, your files, a browser and the Rescue panel. Nothing from the normal Orion session starts.
set $mod Mod4
font pango:Noto Sans 11
output * bg #101426 solid_color
default_border normal 2
default_floating_border normal 2
client.focused          #7C5CFF  #1B2140    #FFFFFF  #00E5FF   #7C5CFF
client.unfocused        #141932  #0B0F1E    #A0A6C8  #141932   #141932
input * xkb_layout us
include ~/.config/orion/sway.d/*.conf

exec mako
exec foot
exec sh -c 'f=$(command -v orion-files || command -v thunar); [ -n "$f" ] && exec "$f"'
exec sh -c 'b=$(command -v orion-browser || command -v firefox); [ -n "$b" ] && exec "$b"'
exec orion-rescue --session
for_window [app_id="^ai\.orion\.Rescue$"] floating enable, resize set 760 600, move position center, focus

bindsym $mod+Return exec foot
bindsym Ctrl+Alt+t exec foot
bindsym $mod+d exec wofi --show drun
bindsym Ctrl+Alt+space exec wofi --show drun
bindsym $mod+e exec orion-files
bindsym Ctrl+Alt+e exec orion-files
bindsym $mod+Escape exec orion-rescue --session
bindsym Ctrl+Alt+Delete exec orion-rescue --session
bindsym Mod1+Tab focus next
bindsym Mod1+F4 kill
bindsym $mod+Shift+q kill
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+e exec swaynag -t warning -m 'Leave the Rescue desktop?' -B 'Log out' 'swaymsg exit'
bindsym $mod+l exec orion-lock
bindsym Ctrl+Alt+l exec orion-lock
floating_modifier $mod normal
exec swayidle -w before-sleep 'orion-lock --now'

bar {
    position top
    status_command while echo "Rescue desktop   Ctrl+Alt+Del: Rescue panel   Alt+Tab: next window   Alt+F4: close   Super+Shift+E: log out   $(date +'%a %H:%M')"; do sleep 30; done
    colors {
        background #0B0F1E
        statusline #D8DEFF
        focused_workspace #7C5CFF #7C5CFF #FFFFFF
        inactive_workspace #0B0F1E #0B0F1E #8888AA
    }
}
