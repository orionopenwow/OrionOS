# OrionOS: mpv defaults (os/apps/mpv/mpv.conf -> /etc/mpv/mpv.conf). Your own ~/.config/mpv/mpv.conf wins.
# Use the graphics card to decode video when it can do so safely; falls back to the CPU.
hwdec=auto-safe
# Remember where you stopped; keep the window open at the end instead of closing.
save-position-on-quit=yes
keep-open=yes
# Orion colours: Starlight text on Void, Accretion progress bar, Figtree font.
background='#05070E'
osd-font='Figtree'
osd-font-size=40
osd-color='#D8DEFF'
osd-border-color='#05070E'
osd-border-size=2
osd-bar-align-y=0.9
sub-font='Figtree'
sub-color='#D8DEFF'
sub-border-color='#05070E'
script-opts-append=osc-seekbarstyle=bar
