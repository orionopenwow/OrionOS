# OrionOS USB boot menu. Two system slots (a, b): an update is tried once; if it never reaches the Orion screen,
# the next start goes back to the slot that worked. State lives in /EFI/orion/grubenv on the ORIONEFI partition.
set timeout=4
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta
insmod part_gpt
insmod fat
insmod ext2
search --no-floppy --label ORIONEFI --set=efi
search --no-floppy --label ORIONSYS --set=sys
set envfile=($efi)/EFI/orion/grubenv
load_env -f $envfile
if [ -z "${slot}" ]; then set slot=a; fi
# Orion's menu (Art Update): stars, the mark, Unbounded/Figtree, violet highlight. Made by os/image/art-boot.sh;
# without it (or without a graphics mode) this stays the plain text menu above.
set orion_theme=($efi)/EFI/orion/theme
if [ -f ${orion_theme}/theme.txt ]; then
  insmod all_video
  insmod gfxterm
  insmod png
  # The wide 32-px title font must not become the console font ("glyphs too large"): load it first, then name
  # the console's. (GRUB's script has no && / ||, hence the nesting.)
  loadfont ${orion_theme}/orion-unbounded-32.pf2
  loadfont ${orion_theme}/orion-figtree-20.pf2
  if loadfont ${orion_theme}/orion-figtree-16.pf2; then
    set gfxterm_font="Orion Figtree Regular 16"
    set gfxmode=auto
    set gfxpayload=keep
    if terminal_output gfxterm; then set theme=${orion_theme}/theme.txt; fi
  fi
fi
# Reduced motion (orion-ctl login reduced-motion on): the splash is one still picture with simple fades.
if [ "${motion}" = "still" ]; then set orion_splash="plymouth.splash=orion-still"; else set orion_splash=""; fi
set boot_slot=${slot}
if [ -n "${next}" ]; then
  if [ "${tries}" = "1" ]; then
    set tries=0
    save_env -f $envfile tries
    set boot_slot=${next}
  else
    # the new slot was tried and never confirmed: go back, remember why
    set failed=${next}
    set next=
    save_env -f $envfile next failed
  fi
fi

menuentry "OrionOS" {
  linux ($sys)/slots/${boot_slot}/vmlinuz boot=casper live-media=/dev/disk/by-label/ORIONSYS live-media-path=/slots/${boot_slot} persistent orion.slot=${boot_slot} quiet splash ${orion_splash} noprompt panic=10 ---
  initrd ($sys)/slots/${boot_slot}/initrd
}
menuentry "Try Orion (nothing is saved)" {
  linux ($sys)/slots/${boot_slot}/vmlinuz boot=casper live-media=/dev/disk/by-label/ORIONSYS live-media-path=/slots/${boot_slot} orion.slot=${boot_slot} orion.try=1 quiet splash ${orion_splash} noprompt panic=10 ---
  initrd ($sys)/slots/${boot_slot}/initrd
}
menuentry "OrionOS (safe graphics)" {
  linux ($sys)/slots/${boot_slot}/vmlinuz boot=casper live-media=/dev/disk/by-label/ORIONSYS live-media-path=/slots/${boot_slot} persistent orion.slot=${boot_slot} nomodeset noprompt panic=10 ---
  initrd ($sys)/slots/${boot_slot}/initrd
}
menuentry "OrionOS, copy to memory first (16 GB+ RAM: faster)" {
  linux ($sys)/slots/${boot_slot}/vmlinuz boot=casper live-media=/dev/disk/by-label/ORIONSYS live-media-path=/slots/${boot_slot} persistent toram orion.slot=${boot_slot} quiet splash ${orion_splash} noprompt panic=10 ---
  initrd ($sys)/slots/${boot_slot}/initrd
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry "Computer's firmware settings (BIOS/UEFI)" { fwsetup }
fi
