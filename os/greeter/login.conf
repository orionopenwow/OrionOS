# How OrionOS starts. Change it with  orion-ctl login auto|password  (or Settings > Login screen).
#   auto      straight into Orion, no password (the VM lab and the USB stick, where the vault passphrase already
#             protects everything)
#   password  the starry login screen asks for your password first
LOGIN_MODE=auto
# Whose login screen it is
LOGIN_USER=orion
# 1 = a simple fade instead of the black-hole swirl
REDUCED_MOTION=0
# Started by the login screen's "Rescue desktop" button (plain Sway, a terminal, files, a browser; no Orion screen)
RESCUE_CMD=/opt/orion/rescue/orion-rescue-session
