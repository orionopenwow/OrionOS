# OrionOS dual boot and boot counting (os/dualboot -> /etc/sway/config.d/62-orion-dualboot.conf, read by the session's
# "include /etc/sway/config.d/*"): after a start where OrionOS had to go back to before an update, say so plainly.
exec sh -c 'sleep 8; command -v orion-bootcount >/dev/null && orion-bootcount notify >/dev/null 2>&1'
