<!doctype html>
<html><head><meta charset="utf-8"><title>Done</title></head>
<body>
  <h1 id="msg"></h1>
  <script>
    const p = new URLSearchParams(location.search);
    setTimeout(() => {
      document.getElementById('msg').textContent = `Release ${p.get('tag')} published (${p.get('channel')}${p.get('pre') ? ', pre-release' : ''})`;
    }, 300);
  </script>
</body></html>
