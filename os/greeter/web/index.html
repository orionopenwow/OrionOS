<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file:; img-src file: data:; connect-src 'none'">
<title>Orion Login</title>
<link rel="stylesheet" href="greeter.css">
</head>
<body>
<canvas id="hole" aria-hidden="true"></canvas>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="veil" aria-hidden="true"></canvas>

<main id="ui">
  <div class="clock" id="clock-block">
    <time id="clock" class="time">--:--</time>
    <div id="date" class="date"></div>
  </div>

  <div class="who" id="who">
    <div class="avatar" id="avatar" aria-hidden="true"><span id="initial">O</span></div>
    <div class="name" id="name">Orion</div>
  </div>

  <form id="login" class="field" autocomplete="off" novalidate>
    <label for="pw" class="sr-only" id="pw-label">Password</label>
    <input id="pw" type="password" placeholder="Password" spellcheck="false" autocapitalize="off"
           autocomplete="off" aria-describedby="status" autofocus>
    <button type="submit" id="go" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h13M13 6l6 6-6 6" fill="none"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>

  <div class="choices" id="choices" role="group" aria-label="How to start">
    <button type="button" class="choice main" id="go-orion" data-target="orion">Start Orion again</button>
    <button type="button" class="choice" id="go-rescue" data-target="rescue"
            title="A plain desktop with a terminal, your files and a browser, without the Orion screen">Rescue desktop</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="caps" id="caps" role="alert" hidden>Caps Lock is on</div>
</main>

<script src="shader.js"></script>
<script src="greeter.js"></script>
</body>
</html>
