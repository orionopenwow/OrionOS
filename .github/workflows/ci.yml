# Runs on every push and pull request: secret scan, daemon tests, OrionOS tests and script checks, HUD typecheck
# and tests. Release builds stay in release.yml (copied from scripts/ci by `npm run release`).
#
# Safe for a public repo: it only uses the read-only GITHUB_TOKEN, never uses pull_request_target, never prints
# secrets, and every third-party action is pinned to a full commit (the tag is in the comment next to it).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Toolkit: Secret Shield. Rules and allowlist: .gitleaks.toml. The pre-commit hook (.githooks/) catches
  # secrets before a commit is made; this is the net for anything committed without the hook.
  # GitHub push protection is a second net the owner turns on in the repo settings.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret Shield (gitleaks on current files + full history; download checked against its SHA-256)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --config .gitleaks.toml
      - name: Secret Shield (built-in scanner, same patterns as the hook fallback)
        run: node scripts/secret-shield/scanner.mjs --tree

  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies (light set; voice models are not needed for tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "fastapi>=0.115,<1" "uvicorn[standard]>=0.30" mss "Pillow>=10.3" "ImageHash>=4.3.1" \
            pytesseract "lancedb>=0.13" "pyarrow>=16" "numpy>=1.26" "httpx>=0.27" "pydantic>=2.7,<3" "python-dotenv>=1.0" \
            "cryptography>=42" python-multipart PyYAML RapidFuzz jsonschema
      - name: Daemon tests
        working-directory: apps/daemon
        run: python -m pytest tests -q -p no:warnings -p no:cacheprovider
      - name: The daemon also runs on Windows (no bare Linux-only imports)
        working-directory: apps/daemon
        run: python -m pytest tests/test_windows_imports.py -q -p no:cacheprovider

  orionos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML Pillow
      - name: Shell syntax
        run: |
          # every tracked file that is a shell script (.sh, or a bash/sh first line); Python helpers are skipped
          git ls-files -z -- os scripts '*.sh' | while IFS= read -r -d '' f; do
            case "$f" in *.sh) ;; *) head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' || continue ;; esac
            bash -n "$f" || { echo "Syntax error in $f"; exit 1; }
          done
      - name: Cloud-init YAML
        run: python3 -c "import sys,yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" os/cloud-init/*.yaml
      - name: Boardroom client compiles
        run: python3 -m py_compile apps/boardroom/orion_boardroom.py
      - name: OrionOS tests
        run: |
          status=0
          for d in os/*/tests; do
            echo "::group::$d"
            python -m pytest -q -p no:cacheprovider "$d" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: HUD package for the VMs is present
        run: test -f os/dist/Orion_2.0.0_amd64.deb

  hud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck
      - name: HUD tests
        run: npm test -w @orion/desktop
