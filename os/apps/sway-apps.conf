# OrionOS everyday apps (os/apps/sway-apps.conf -> /etc/sway/config.d/60-orion-apps.conf, read by the session's
# "include /etc/sway/config.d/*"). Super+E (and Ctrl+Alt+E) already opens Orion Files (Thunar).
# Super+B / Ctrl+Alt+B: the web browser (whatever is set as default for web links; Firefox out of the box).
bindsym $mod+b exec orion-browser
bindsym Ctrl+Alt+b exec orion-browser
# Small tool windows float in the middle instead of taking a whole tile.
for_window [app_id="org.gnome.Calculator"] floating enable, move position center
for_window [app_id="org.gnome.FileRoller"] floating enable, resize set 900 600, move position center
# Firefox's own small windows (Library, downloads, picture-in-picture) float too.
for_window [app_id="firefox" title="^Library$"] floating enable
for_window [app_id="firefox" title="^Picture-in-Picture$"] floating enable, sticky enable
# [testcenter] Super+T: the Orion Test Center (opens in the HUD and runs the automatic checks; orion-ctl test).
bindsym $mod+t exec orion-ctl test >/dev/null
